name: mechanical-checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Repository checks
        run: python3 scripts/check.py

      # Every review this repo publishes must pass the scripts this repo
      # ships. check_examples.py finds them and reads each one's artifacts
      # from its own Scorecard (#58).
      - name: Published reviews
        run: python3 tools/check_examples.py

      # Regression fixtures: each mutates a published review to reproduce a
      # defect an issue found, and fails if a script lets it through again.
      - name: Script regression fixtures
        run: python3 scripts/test_scripts.py
