name: release

# A pushed vX.Y.Z tag publishes its GitHub Release. The notes are that
# version's CHANGELOG.md entry, without its heading, printed by
# scripts/release_notes.py, which refuses a tag that disagrees with the README
# badge, the PROMPT.md header or the newest CHANGELOG entry, and a version
# marked never released. Nothing is published unless every check passes.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # A release is cut from main, never from a side branch.
      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Repository checks
        run: python3 scripts/check.py

      - name: Script regression fixtures
        run: python3 scripts/test_scripts.py

      - name: Release notes from CHANGELOG.md
        run: python3 scripts/release_notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
