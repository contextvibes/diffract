# Diffract Configuration
# Place this file in your project root to configure automated reviews.
# See: https://github.com/contextvibes/diffract
#
# When present, agentic reviewers (Antigravity, Claude Code, etc.) read
# these governors as the prescribed defaults. A user who can confirm PLAN
# still outranks this file — the config is a proposal presented at the
# checkpoint, not a bypass of it. Only a run with no user available
# proceeds on the config alone, tagged [governors: diffract.yaml].

# Config schema version — the key set this file was written against
# (version, compass, cobra, integrity, scope, max_cycles), normative in
# PROMPT.md's Agentic Execution section. Unchanged since 0.2. A reviewer
# that does not know this schema reports the mismatch and does not apply
# the config.
version: "0.2"

# 🧭 Compass — What are we looking for?
# A clear, falsifiable question that scopes the review.
compass: "Is this code ready for production?"

# 🐍 Cobra — How cautious should we be?
# Options: prototype | production | library-framework
# The levels' operational definitions are normative in PROMPT.md's PLAN
# section (non-normative restatement here would drift, so there isn't one).
cobra: production

# ⚖️ Integrity — What counts as evidence?
# Options: file-line, file-line-with-anchoring (default)
# PROMPT.md's Integrity default is file:line *plus* cognitive anchoring, and
# rule 3 forbids claiming "no findings" without it — so `file-line` alone
# cannot produce a compliant empty lens.
integrity: file-line-with-anchoring

# 📐 Default review scope
# Options:
#   pr   — Review only changed files + direct dependents (git diff)
#   full — Review the entire codebase
#   path — Review a specific subtree (requires user to specify path)
# Any value other than `full` produces a partial review. Name what it left
# out in the Gap Analysis — see PROMPT.md rule 6. Setting this key is not
# the disclosure.
scope: pr

# 🔄 PDCA Circuit Breakers
max_cycles: 3          # Maximum PDCA iterations before stopping
